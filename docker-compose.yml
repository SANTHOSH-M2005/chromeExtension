services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartconsent-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - CHROMA_DB_DIR=/app/data/chroma_db
      - RAG_DOCS_DIR=/app/rag/documents
      - DATABASE_URL=sqlite:////app/data/smartconsent.db
    volumes:
      # Persistent storage for SQLite DB and Chroma Vector Index
      - smartconsent-data:/app/data
      # Mount legal documents so additions are immediately accessible
      - ./rag/documents:/app/rag/documents:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  smartconsent-data:
    name: smartconsent-data
